name: Packer AMI Build

on:
  push:
    branches: [main, release*]
  pull_request:
    branches: [main, release*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Packer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Check Ansible playbook and roles
        run: ansible-playbook -i localhost, --syntax-check ansible/harden.yml

      - name: Initialize Packer plugins
        run: packer init .

      - name: Check Packer formatting
        run: packer fmt -check -recursive .

      - name: Validate Packer template
        run: packer validate -var-file=dev.pkvars.hcl .

  build:
    name: Build Packer
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: dev

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: base-aml3-x64-build
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: packer-build

      - name: Initialize Packer plugins
        run: packer init .

      - name: Build AMI
        run: packer build -var-file=dev.pkvars.hcl -color=false .

      - name: Upload AMI manifest
        uses: actions/upload-artifact@v4
        with:
          name: packer-ami-manifest
          path: manifest.json
          if-no-files-found: error